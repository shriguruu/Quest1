[project]
name = "dialogue-locator"
version = "0.1.0"
description = "CLI tool to find the exact video frame where a line of dialogue is spoken."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "structlog>=23.1.0",
    "yt-dlp>=2026.8.19",
    "curl-cffi>=0.16.2",
    "av>=18.1.0",
    "pillow>=12.3.0",
    "faster-whisper>=1.2.1",
    "rapidfuzz>=3.14.5",
    "jellyfish>=1.2.1",
    "metaphone>=0.6",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
dialogue-locator = "dialogue_locator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# torch defaults to a CUDA build on PyPI (2-3GB). This project runs ASR and
# forced alignment on CPU, so torch and torchaudio are pinned to PyTorch's
# CPU-only index. `explicit = true` keeps every other dependency on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
